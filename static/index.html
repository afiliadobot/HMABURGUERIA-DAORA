<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendrix Gestão — Custo, Estoque e Preço</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TALÃO — sistema visual
   Referência: quadro de açougue / talão de comanda de lanchonete.
   Serifa robusta (baixo contraste) pros títulos, sem-serifa limpa
   pro corpo, mono só pra números de dinheiro (alinhamento tabular).
   ============================================================ */
:root {
  --ink: #17152E;
  --ink-soft: #6E6B85;
  --ink-faint: #A7A3C0;
  --paper: #F6F5FB;
  --paper-raised: #FFFFFF;
  --line: #E5E2F0;
  --line-strong: #D2CDE6;
  --amber: #6C3CE9;
  --amber-dark: #5A2FD1;
  --amber-tint: #ECE5FC;
  --forest: #1F9D6B;
  --forest-tint: #DEF5EA;
  --brick: #E23F63;
  --brick-tint: #FCE3E9;
  --sidebar: #0D0B2E;
  --sidebar-text: #C7C3E6;
  --sidebar-text-dim: #6F6B96;
  --sidebar-active: #1B1850;
  --radius: 8px;
  --shadow: 0 1px 2px rgba(13,11,46,0.06), 0 8px 24px rgba(13,11,46,0.08);
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'Roboto Mono', monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  background: var(--paper);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 700; margin: 0; color: var(--ink); }
p { margin: 0; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
a { color: var(--amber-dark); }
button, input, select, textarea { font-family: inherit; font-size: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* --- Layout raiz --- */
#auth-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
#app-screen { display: none; min-height: 100vh; }
#app-screen.visible { display: flex; }

/* --- Tela de autenticação --- */
.auth-card {
  width: 100%;
  max-width: 420px;
}
.auth-brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 10px;
  margin-bottom: 28px;
}
.auth-brand-row { display: flex; align-items: center; gap: 10px; }
.auth-brand .mark {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 700;
  color: var(--ink);
}
.brand-orb {
  width: 34px;
  height: 34px;
  border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%;
  background: linear-gradient(135deg, #3FCDE0 0%, #6C3CE9 45%, #E63FC4 100%);
  flex-shrink: 0;
  box-shadow: 0 2px 10px rgba(108,60,233,0.35);
}
.brand-orb-sm { width: 24px; height: 24px; }
.brand-wordmark { font-family: var(--font-display); font-weight: 700; }
.brand-wordmark .accent { color: var(--amber); }
.auth-brand .tagline {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: #FFFEFA;
  background: var(--amber);
  padding: 6px 14px;
  border-radius: 20px;
}
.auth-brand .subtext { font-size: 13px; color: var(--ink-soft); }
.auth-panel {
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 28px;
}
.auth-tabs {
  display: flex;
  border-bottom: 1px solid var(--line);
  margin-bottom: 20px;
}
.auth-tab {
  flex: 1;
  padding: 10px 0;
  text-align: center;
  font-weight: 600;
  color: var(--ink-faint);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.auth-tab.active { color: var(--ink); border-bottom-color: var(--amber); }
.auth-form { display: none; flex-direction: column; gap: 12px; }
.auth-form.active { display: flex; }
.auth-error {
  background: var(--brick-tint);
  color: var(--brick);
  border-radius: var(--radius);
  padding: 10px 12px;
  font-size: 13.5px;
  display: none;
}
.auth-error.visible { display: block; }

/* --- Campos --- */
label { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); display: block; margin-bottom: 4px; }
.field { display: flex; flex-direction: column; }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=datetime-local], select, textarea {
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  padding: 9px 11px;
  background: var(--paper-raised);
  color: var(--ink);
  width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--amber); }
input::placeholder { color: var(--ink-faint); }
.field-row { display: flex; gap: 10px; }
.field-row > * { flex: 1; }
.checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-soft); }

/* --- Botões --- */
button.btn {
  border: none;
  border-radius: var(--radius);
  padding: 10px 16px;
  font-weight: 600;
  cursor: pointer;
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
}
button.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--amber); color: #FFFDF8; }
.btn-primary:hover:not(:disabled) { background: var(--amber-dark); }
.btn-secondary { background: transparent; color: var(--ink); border: 1px solid var(--line-strong) !important; }
.btn-secondary:hover:not(:disabled) { background: var(--paper); border-color: var(--ink-faint) !important; }
.btn-danger { background: transparent; color: var(--brick); border: 1px solid var(--brick-tint) !important; }
.btn-danger:hover:not(:disabled) { background: var(--brick-tint); }
.btn-block { width: 100%; }
.btn-sm { padding: 6px 10px; font-size: 12.5px; }
.btn-link { background: none; border: none; color: var(--amber-dark); font-weight: 600; cursor: pointer; padding: 0; }

/* --- Shell do app --- */
.sidebar {
  width: 232px;
  flex-shrink: 0;
  background: var(--sidebar);
  color: var(--sidebar-text);
  display: flex;
  flex-direction: column;
  padding: 20px 0;
}
.sidebar-brand {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  color: #FFFEFA;
  padding: 0 20px 18px;
  border-bottom: 1px solid #242057;
  margin-bottom: 8px;
}
.sidebar-business { padding: 12px 20px 16px; border-bottom: 1px solid #242057; margin-bottom: 10px; }
.sidebar-business .name { font-weight: 600; color: #FFFEFA; font-size: 14px; }
.sidebar-business .segment { font-size: 12px; color: var(--sidebar-text-dim); margin-top: 2px; }
.sidebar-nav { flex: 1; overflow-y: auto; }
.sidebar-group-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.03em;
  color: var(--sidebar-text-dim);
  padding: 14px 20px 6px;
}
.sidebar-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 20px;
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--sidebar-text);
  border-left: 3px solid transparent;
}
.sidebar-item:hover { background: var(--sidebar-active); }
.sidebar-item.active { background: var(--sidebar-active); border-left-color: var(--amber); color: #FFFEFA; }
.sidebar-item .icon { width: 16px; text-align: center; opacity: 0.85; }
.sidebar-footer { padding: 14px 20px 0; border-top: 1px solid #242057; margin-top: 8px; }

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
.main-header {
  padding: 18px 32px;
  border-bottom: 1px solid var(--line);
  background: var(--paper-raised);
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-shrink: 0;
}
.main-header h1 { font-size: 22px; }
.main-header .subtitle { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
.main-body { flex: 1; overflow-y: auto; padding: 28px 32px 60px; }
.section { display: none; }
.section.active { display: block; }

/* --- Componentes de conteúdo --- */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

.card {
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
}
.card + .card { margin-top: 16px; }
.card h3 { font-size: 15px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.card h3 .count { font-family: var(--font-mono); font-weight: 500; color: var(--ink-faint); font-size: 13px; }

.stat {
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
}
.stat .label { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
.stat .value { font-family: var(--font-mono); font-size: 26px; font-weight: 600; margin-top: 4px; }
.stat .value.positive { color: var(--forest); }
.stat .value.negative { color: var(--brick); }

table.data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.data-table th {
  text-align: left;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-soft);
  padding: 0 10px 8px;
  border-bottom: 1px solid var(--line-strong);
}
table.data-table td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data-table td.num, table.data-table th.num { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
table.data-table tr:last-child td { border-bottom: none; }
table.data-table tr:hover td { background: var(--paper); }
.table-actions { display: flex; gap: 6px; justify-content: flex-end; }
.table-wrap { overflow-x: auto; }

.pill {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 20px;
}
.pill-ok { background: var(--forest-tint); color: var(--forest); }
.pill-warn { background: var(--amber-tint); color: var(--amber-dark); }
.pill-bad { background: var(--brick-tint); color: var(--brick); }
.pill-neutral { background: var(--line); color: var(--ink-soft); }

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--ink-soft);
  font-size: 13.5px;
}
.empty-state .big { font-family: var(--font-display); font-size: 17px; color: var(--ink); margin-bottom: 6px; }

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: #FFFEFA;
  padding: 12px 20px;
  border-radius: var(--radius);
  font-size: 13.5px;
  font-weight: 500;
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
  z-index: 1000;
  max-width: 480px;
  box-shadow: var(--shadow);
}
.toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.toast-error { background: var(--brick); }
.toast.toast-ok { background: var(--forest); }

.modal-backdrop {
  display: none;
  position: fixed; inset: 0;
  background: rgba(33,28,22,0.45);
  align-items: center; justify-content: center;
  z-index: 500;
  padding: 20px;
}
.modal-backdrop.visible { display: flex; }
.modal {
  background: var(--paper-raised);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  width: 100%;
  max-width: 560px;
  max-height: 86vh;
  display: flex;
  flex-direction: column;
}
.modal-header {
  padding: 18px 22px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-header h3 { font-size: 16px; }
.modal-close { background: none; border: none; font-size: 20px; color: var(--ink-soft); cursor: pointer; line-height: 1; padding: 4px; }
.modal-body { padding: 20px 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.modal-footer { padding: 16px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; }

.hint { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
.section-intro { color: var(--ink-soft); font-size: 13.5px; margin-bottom: 20px; max-width: 640px; }
.divider { border: none; border-top: 1px solid var(--line); margin: 18px 0; }
.receipt-line { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed var(--line-strong); font-size: 13.5px; }
.receipt-line:last-child { border-bottom: none; }
.receipt-line .label { color: var(--ink-soft); }
.receipt-line .value { font-family: var(--font-mono); font-weight: 600; }
.receipt-line.total { border-top: 2px solid var(--ink); border-bottom: none; margin-top: 6px; padding-top: 12px; font-weight: 700; }
.receipt-line.total .value { font-size: 17px; }

.loading-spinner { text-align: center; padding: 40px; color: var(--ink-faint); font-size: 13px; }
</style>
</head>
<body>

<!-- ===================== TELA DE AUTENTICAÇÃO ===================== -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand-row">
        <span class="brand-orb"></span>
        <span class="mark brand-wordmark">Vend<span class="accent">rix</span></span>

<script>
// ============================================================
// TALÃO — núcleo (estado, API, autenticação, navegação)
// ============================================================
const state = {
  token: localStorage.getItem('talao_token') || null,
  business: null,
  config: null,
  period: null,
  section: 'visao-geral',
  cache: {}, // cache leve por seção, invalidado ao navegar de volta
};

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (state.token) headers['Authorization'] = `Bearer ${state.token}`;
  const resp = await fetch(path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
  let data = null;
  try { data = await resp.json(); } catch (e) { /* sem corpo, ex: 204 */ }
  if (!resp.ok) {
    const msg = (data && data.detail) ? (typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail)) : `Erro ${resp.status}`;
    throw new Error(msg);
  }
  return data;
}

function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast visible toast-${type}`;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('visible'), 3800);
}

function money(centavos) {
  if (centavos === null || centavos === undefined) return '—';
  const sign = centavos < 0 ? '-' : '';
  const v = Math.abs(centavos) / 100;
  return `${sign}R$ ${v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}
function pct(v) {
  if (v === null || v === undefined) return '—';
  return `${Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 2 })}%`;
}
function qtyLabel(q, unidade) {
  const n = Number(q);
  return `${n.toLocaleString('pt-BR', { maximumFractionDigits: 3 })} ${unidade || ''}`.trim();
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Aceita tanto "4,90" (padrão brasileiro) quanto "4.90" (padrão americano) —
// corrige o bug em que o campo de número do navegador ignorava a vírgula
// silenciosamente e concatenava os dígitos (ex: "4,90" virava 490).
function parseNumBR(str) {
  if (str === null || str === undefined) return NaN;
  str = String(str).trim();
  if (str === '') return NaN;
  if (str.includes(',')) {
    // vírgula presente: é o separador decimal — remove pontos (milhar) antes
    str = str.replace(/\./g, '').replace(',', '.');
  }
  return parseFloat(str);
}

// Camada extra de proteção: enquanto o usuário digita em QUALQUER campo
// decimal, limpa em tempo real — nunca deixa acumular caractere que não seja
// dígito, e nunca deixa existir mais de um separador decimal (vírgula OU
// ponto, o que vier primeiro). Neutraliza qualquer valor estranho que tente
// entrar no campo (autopreenchimento do navegador, colar texto sujo, etc.)
// sem depender só de o navegador se comportar bem.
document.addEventListener('input', (e) => {
  if (!e.target.matches('input[inputmode="decimal"]')) return;
  let v = e.target.value;
  const limpo = v.replace(/[^0-9.,]/g, '');
  let semSeparadorDuplicado = limpo;
  const idxSeparador = limpo.search(/[.,]/);
  if (idxSeparador !== -1) {
    const antes = limpo.slice(0, idxSeparador + 1);
    const depois = limpo.slice(idxSeparador + 1).replace(/[.,]/g, '');
    semSeparadorDuplicado = antes + depois;
  }
  if (semSeparadorDuplicado !== v) e.target.value = semSeparadorDuplicado;
});

function openModal(title, bodyHtml, footerButtons) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  const footer = document.getElementById('modal-footer');
  footer.innerHTML = '';
  (footerButtons || []).forEach(b => {
    const btn = document.createElement('button');
    btn.className = `btn ${b.cls || 'btn-secondary'}`;
    btn.textContent = b.label;
    btn.onclick = b.onClick;
    footer.appendChild(btn);
  });
  document.getElementById('modal-backdrop').classList.add('visible');
  // Camada extra de proteção: campo decimal que não tem um valor pré-definido
  // no próprio HTML (não é edição de algo existente) começa SEMPRE vazio de
  // verdade — nunca reaproveita nada que o navegador tente sugerir sozinho,
  // nem na hora que abre, nem alguns instantes depois (autopreenchimento
  // assíncrono de alguns navegadores).
  const limparCamposVazios = () => {
    document.querySelectorAll('#modal-body input[inputmode="decimal"]').forEach(inp => {
      if (!inp.hasAttribute('value')) inp.value = '';
    });
  };
  limparCamposVazios();
  setTimeout(limparCamposVazios, 60);
}
function closeModal() { document.getElementById('modal-backdrop').classList.remove('visible'); }
document.getElementById('modal-close').onclick = closeModal;
document.getElementById('modal-backdrop').addEventListener('click', (e) => { if (e.target.id === 'modal-backdrop') closeModal(); });

function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

  { n: 1, label: 'Cadastrar um insumo', section: 'insumos', desc: 'Os ingredientes que você compra: carne, pão, queijo…' },
  { n: 2, label: 'Registrar o preço do insumo', section: 'insumos', desc: 'Quanto você pagou — sem isso não dá pra calcular custo de nada.' },

async function computeOnboardingStatus() {
  const status = new Array(8).fill(false);
  try {
    const ingredients = await api('/ingredients?incluir_arquivados=true');
    status[1] = ingredients.length > 0;
    if (status[1]) {
      for (const ing of ingredients.slice(0, 8)) {
        const precos = await api(`/ingredients/${ing.id}/prices`);
        if (precos.length > 0) { status[2] = true; break; }
      }
    }
    const recipes = await api('/recipes?incluir_arquivados=true');
    status[3] = recipes.some(r => r.itens && r.itens.length > 0);
    const products = await api('/products?incluir_arquivados=true');
    status[4] = products.length > 0;
    const channels = await api('/channels?incluir_arquivados=true');
    status[5] = channels.length > 0;
    if (status[4] && status[5]) {
      for (const p of products.slice(0, 8)) {
        const pricings = await api(`/products/${p.id}/pricing`);
        if (pricings.length > 0) { status[6] = true; break; }
      }
    }
    const sales = await api('/sales');
    status[7] = sales.some(s => s.status === 'confirmada');
  } catch (e) { /* se algo falhar, mostra o guia mesmo assim com o que deu certo */ }
  return status;
}

function renderOnboardingCard(status) {
  const done = status.filter(Boolean).length - 1; // -1 porque status[0] nao existe
  const total = ONBOARDING_STEPS.length;
  if (done >= total) {
    return `<div class="card" style="border-color:var(--forest-tint);background:var(--forest-tint);margin-bottom:20px;">
      <strong style="color:var(--forest);">✓ Primeiros passos completos</strong> — seu negócio já passou pelo ciclo inteiro, do insumo à venda.
      <button class="btn btn-sm btn-secondary" style="float:right;" onclick="toggleOnboardingCard()">Ver de novo</button>
    </div>`;
  }
  let proximoPassoEncontrado = false;
  const itensHtml = ONBOARDING_STEPS.map(step => {
    const feito = status[step.n];
    let estadoClasse = 'pending';
    let botao = '';
    if (feito) {
      estadoClasse = 'done';
    } else if (!proximoPassoEncontrado) {
      estadoClasse = 'current';
      proximoPassoEncontrado = true;
      botao = `<button class="btn btn-sm btn-primary" onclick="goToSection('${step.section}')">Ir para lá</button>`;
    }
    const numeroHtml = feito
      ? `<span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--forest);color:#fff;font-weight:700;font-size:13px;">✓</span>`
      : `<span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:${estadoClasse==='current'?'var(--amber)':'var(--line)'};color:${estadoClasse==='current'?'#fff':'var(--ink-faint)'};font-weight:700;font-size:13px;">${step.n}</span>`;
    return `<div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);opacity:${estadoClasse==='pending'?'0.55':'1'};">
      ${numeroHtml}
      <div style="flex:1;">
        <div style="font-weight:600;font-size:13.5px;">${esc(step.label)}</div>
        <div class="hint">${esc(step.desc)}</div>
      </div>
      ${botao}
    </div>`;
  }).join('');

  return `<div class="card" id="onboarding-card" style="margin-bottom:20px;">
    <h3>Primeiros passos <span class="count">${Math.max(done,0)}/${total}</span></h3>
    <p class="section-intro" style="margin-bottom:6px;">Siga essa ordem — cada passo depende do anterior.</p>
    ${itensHtml}
  </div>`;
}

  const existing = document.getElementById('onboarding-card');
  if (existing) { existing.closest('.card').remove(); return; }
  goToSection('visao-geral');
}

async function registrarMovimento(id, endpoint, nome) {
  const qtd = parseNumBR(document.getElementById(endpoint === 'loss' ? 'mov-perda-qtd' : 'mov-consumo-qtd').value);
  const nota = document.getElementById(endpoint === 'loss' ? 'mov-perda-nota' : 'mov-consumo-nota').value;
  if (!qtd || !nota) { toast('Preencha quantidade e motivo.', 'error'); return; }
  try {
    await api(`/ingredients/${id}/${endpoint}`, { method: 'POST', body: JSON.stringify({ quantidade: qtd, nota }) });
    toast('Movimento registrado.');
    closeModal(); openIngredientMovementsModal(id, nome); goToSection('insumos');
  } catch (err) { toast(err.message, 'error'); }
}

async function registrarAjuste(id, nome) {
  const saldo = parseNumBR(document.getElementById('mov-ajuste-saldo').value);
  const nota = document.getElementById('mov-ajuste-nota').value;
  if (isNaN(saldo) || !nota) { toast('Preencha o novo saldo e a justificativa.', 'error'); return; }
  try {
    await api(`/ingredients/${id}/adjustment`, { method: 'POST', body: JSON.stringify({ novo_saldo: saldo, nota }) });
    toast('Ajuste registrado.');
    closeModal(); openIngredientMovementsModal(id, nome); goToSection('insumos');
  } catch (err) { toast(err.message, 'error'); }
}

let compraItensTemp = [];

SECTION_RENDERERS['compras'] = async function () {
  const el = document.getElementById('section-compras');
  document.getElementById('header-extra').innerHTML = `<button class="btn btn-primary" onclick="openPurchaseModal()">+ Nova compra</button>`;
  const list = await api('/purchases');

    el.innerHTML = `<div class="empty-state"><div class="big">Nenhuma compra registrada</div>Registrar uma compra soma automaticamente no estoque dos insumos.</div>`;
    return;
  }
  const suppliers = await api('/suppliers?incluir_arquivados=true');
  const supplierName = (id) => suppliers.find(s => s.id === id)?.nome || '—';
  el.innerHTML = `<div class="table-wrap"><table class="data-table">
    <thead><tr><th>Data</th><th>Fornecedor</th><th class="num">Itens</th><th class="num">Frete</th><th class="num">Total</th></tr></thead>
    <tbody>${list.map(p => {
      const totalItens = p.itens.reduce((s,i) => s + i.preco_total_centavos, 0);
      return `<tr><td>${fmtDate(p.data)}</td><td>${esc(supplierName(p.supplier_id))}</td><td class="num">${p.itens.length}</td><td class="num">${money(p.frete_centavos)}</td><td class="num">${money(totalItens + p.frete_centavos + p.outros_custos_centavos)}</td></tr>`;
    }).join('')}
    </tbody></table></div>`;
};

async function openPurchaseModal() {
  const suppliers = await api('/suppliers?incluir_arquivados=false');
  const ingredients = await api('/ingredients?incluir_arquivados=false');
  if (suppliers.length === 0 || ingredients.length === 0) {
    toast('Cadastre ao menos 1 fornecedor e 1 insumo antes de registrar uma compra.', 'error');
    return;
  }
  compraItensTemp = [];
  renderPurchaseModalBody(suppliers, ingredients);
}

function renderPurchaseModalBody(suppliers, ingredients) {
  const itensHtml = compraItensTemp.map((it, idx) => {
    const ing = ingredients.find(i => i.id === it.ingredient_id);
    return `<div class="receipt-line"><span class="label">${esc(ing.nome)} — ${it.quantidade_comprada}${ing.unidade_compra}</span><span class="value">${money(it.preco_total_centavos)} <button class="btn-link" onclick="removePurchaseItem(${idx})" style="margin-left:8px;color:var(--brick);">remover</button></span></div>`;
  }).join('') || '<p class="hint">Nenhum item adicionado ainda.</p>';

  openModal('Nova compra', `
    <div class="field"><label>Fornecedor</label>
      <select id="purch-supplier">${suppliers.map(s => `<option value="${s.id}">${esc(s.nome)}</option>`).join('')}</select>
    </div>
    <hr class="divider">
    <h4 style="font-size:13px;color:var(--ink-soft);">Adicionar item</h4>
    <div class="field-row">
      <div class="field"><label>Insumo</label>
        <select id="purch-item-ingredient">${ingredients.map(i => `<option value="${i.id}">${esc(i.nome)} (${i.unidade_compra})</option>`).join('')}</select>
      </div>
      <div class="field"><label>Quantidade</label><input type="text" inputmode="decimal" autocomplete="off" step="0.001" id="purch-item-qtd"></div>
      <div class="field"><label>Preço total (R$)</label><input type="text" inputmode="decimal" autocomplete="off" step="0.01" id="purch-item-preco"></div>
    </div>
    <button class="btn btn-sm btn-secondary" onclick="addPurchaseItem()">Adicionar à compra</button>
    <hr class="divider">
    <h4 style="font-size:13px;color:var(--ink-soft);">Itens desta compra</h4>
    <div id="purch-itens-list">${itensHtml}</div>
    <hr class="divider">
    <div class="field-row">
      <div class="field"><label>Frete total (R$, opcional)</label><input type="text" inputmode="decimal" autocomplete="off" step="0.01" id="purch-frete" value="0"></div>
      <div class="field"><label>Outros custos (R$, opcional)</label><input type="text" inputmode="decimal" autocomplete="off" step="0.01" id="purch-outros" value="0"></div>
    </div>
  `, [
    { label: 'Cancelar', cls: 'btn-secondary', onClick: closeModal },
    { label: 'Registrar compra', cls: 'btn-primary', onClick: async () => {
      if (compraItensTemp.length === 0) { toast('Adicione ao menos 1 item.', 'error'); return; }
      try {
        await api('/purchases', { method: 'POST', body: JSON.stringify({
          supplier_id: document.getElementById('purch-supplier').value,
          itens: compraItensTemp,
          frete_centavos: Math.round(parseNumBR(document.getElementById('purch-frete').value || 0) * 100),
          outros_custos_centavos: Math.round(parseNumBR(document.getElementById('purch-outros').value || 0) * 100),
        })});
        closeModal(); toast('Compra registrada — estoque e preço atualizados.'); goToSection('compras');
      } catch (err) { toast(err.message, 'error'); }
    }},
  ]);
  window._purchaseModalData = { suppliers, ingredients };
}

function addPurchaseItem() {
  const ingredient_id = document.getElementById('purch-item-ingredient').value;
  const quantidade_comprada = parseNumBR(document.getElementById('purch-item-qtd').value);
  const preco_total_centavos = Math.round(parseNumBR(document.getElementById('purch-item-preco').value || 0) * 100);
  if (!quantidade_comprada || !preco_total_centavos) { toast('Preencha quantidade e preço do item.', 'error'); return; }
  compraItensTemp.push({ ingredient_id, quantidade_comprada, preco_total_centavos });
  const { suppliers, ingredients } = window._purchaseModalData;
  renderPurchaseModalBody(suppliers, ingredients);
}
function removePurchaseItem(idx) {
  compraItensTemp.splice(idx, 1);
  const { suppliers, ingredients } = window._purchaseModalData;
  renderPurchaseModalBody(suppliers, ingredients);
}

async function openProductDetailModal(id) {
  const p = await api(`/products/${id}`);
  let extraHtml = '';

  if (p.tipo === 'combo') {
    const products = await api('/products?incluir_arquivados=false');
    const others = products.filter(x => x.id !== id);
    const itensHtml = p.itens_combo.map(it => `
      <div class="receipt-line"><span class="label">${esc(it.component_nome)} × ${it.quantidade}</span>
      <span class="value">${money(it.custo_item_centavos)} <button class="btn-link" style="margin-left:8px;color:var(--brick);" onclick="removeComboItem('${id}','${it.id}')">remover</button></span></div>
    `).join('') || '<p class="hint">Nenhum componente ainda.</p>';
    extraHtml = `
      <hr class="divider"><h4 style="font-size:13px;color:var(--ink-soft);">Componentes do combo</h4>
      <div>${itensHtml}</div>
      <div class="field-row" style="margin-top:10px;">
        <div class="field"><label>Adicionar produto</label><select id="combo-item-product">${others.map(o => `<option value="${o.id}">${esc(o.nome)}</option>`).join('')}</select></div>
        <div class="field"><label>Quantidade</label><input type="text" inputmode="decimal" autocomplete="off" step="1" id="combo-item-qtd" value="1"></div>
      </div>
      <button class="btn btn-sm btn-secondary" onclick="addComboItem('${id}')">Adicionar ao combo</button>`;
  } else if (p.tipo === 'pizza_fracionada') {
    const products = await api('/products?incluir_arquivados=false');
    const sabores = products.filter(x => x.tipo === 'simples');
    const itensHtml = p.itens_pizza.map(it => `
      <div class="receipt-line"><span class="label">${esc(it.sabor_nome)} — ${(it.fracao*100).toFixed(0)}%</span>
      <span class="value">${money(it.custo_contribuido_centavos)} <button class="btn-link" style="margin-left:8px;color:var(--brick);" onclick="removePizzaSabor('${id}','${it.id}')">remover</button></span></div>
    `).join('') || '<p class="hint">Nenhum sabor ainda.</p>';
    extraHtml = `
      <hr class="divider"><h4 style="font-size:13px;color:var(--ink-soft);">Sabores (base: ${money(p.custo_base_pizza_centavos)})</h4>
      <div>${itensHtml}</div>
      <div class="field-row" style="margin-top:10px;">
        <div class="field"><label>Sabor (produto simples)</label><select id="pizza-sabor-product">${sabores.map(s => `<option value="${s.id}">${esc(s.nome)}</option>`).join('')}</select></div>
        <div class="field"><label>Fração (ex: 0.5 = metade)</label><input type="text" inputmode="decimal" autocomplete="off" step="0.01" min="0.01" max="1" id="pizza-sabor-fracao" value="0.5"></div>
      </div>
      <button class="btn btn-sm btn-secondary" onclick="addPizzaSabor('${id}')">Adicionar sabor</button>`;
  } else {
    const itensHtml = p.itens.map(it => `<div class="receipt-line"><span class="label">${esc(it.ingredient_nome)} — ${it.quantidade}${it.unidade_base}</span><span class="value">${money(it.custo_item_centavos)}</span></div>`).join('');
    extraHtml = `<hr class="divider"><h4 style="font-size:13px;color:var(--ink-soft);">Ingredientes (via ficha técnica)</h4><div>${itensHtml}</div>`;
  }

  openModal(`${esc(p.nome)} (${p.tipo})`, `
    <div class="receipt-line"><span class="label">Embalagem</span><span class="value">${money(p.embalagem_centavos)}</span></div>
    <div class="receipt-line total"><span class="label">Custo total do item</span><span class="value">${money(p.custo_total_do_item_centavos)}</span></div>
    ${extraHtml}
    <hr class="divider">
    <h4 style="font-size:13px;color:var(--ink-soft);">Precificação por canal</h4>
    <div id="product-pricing-list">Carregando…</div>
    <div class="field-row">
      <div class="field"><label>Canal</label><select id="pricing-channel"></select></div>
      <div class="field"><label>Margem desejada (%)</label><input type="text" inputmode="decimal" autocomplete="off" step="0.01" id="pricing-margem" value="30"></div>
    </div>
    <button class="btn btn-sm btn-secondary" onclick="createProductPricing('${id}')">Precificar neste canal</button>
  `, [{ label: 'Fechar', cls: 'btn-secondary', onClick: () => { closeModal(); goToSection('produtos'); } }]);

  loadProductPricing(id);
}

async function loadProductPricing(productId) {
  const pricings = await api(`/products/${productId}/pricing`);
  const channels = await api('/channels?incluir_arquivados=false');
  const chName = (id) => channels.find(c => c.id === id)?.nome || '—';
  const listEl = document.getElementById('product-pricing-list');
  if (listEl) {
    listEl.innerHTML = pricings.map(pr => `
      <div class="receipt-line">
        <span class="label">${esc(chName(pr.channel_id))} — meta ${pct(pr.margem_desejada_percentual)}${pr.abaixo_do_preco_minimo ? ' <span class="pill pill-bad">abaixo do mínimo</span>' : ''}</span>
        <span class="value">${money(pr.preco_em_vigor_centavos)} <span style="color:var(--ink-faint);font-weight:400;">(mín ${money(pr.preco_minimo_centavos)})</span></span>
      </div>`).join('') || '<p class="hint">Ainda não precificado em nenhum canal.</p>';
  }
  const sel = document.getElementById('pricing-channel');
  if (sel) {
    const jaPrecificados = new Set(pricings.map(p => p.channel_id));
    const disponiveis = channels.filter(c => !jaPrecificados.has(c.id));
    sel.innerHTML = disponiveis.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('') || '<option value="">(todos os canais já precificados)</option>';
  }
}
async function createProductPricing(productId) {
  const channel_id = document.getElementById('pricing-channel').value;
  const margem = parseNumBR(document.getElementById('pricing-margem').value);
  if (!channel_id) { toast('Selecione um canal.', 'error'); return; }
  try {
    await api(`/products/${productId}/pricing`, { method: 'POST', body: JSON.stringify({ channel_id, margem_desejada_percentual: margem }) });
    toast('Precificado.');
    loadProductPricing(productId);
  } catch (err) { toast(err.message, 'error'); }
}

  }
  el.innerHTML = `<div class="table-wrap"><table class="data-table">
    <thead><tr><th>Nome</th><th>Produto</th><th>Canal</th><th class="num">Desconto</th><th class="num">Canal banca</th><th>Status</th><th></th></tr></thead>
    <tbody>${list.map(pr => `
      <tr><td>${esc(pr.nome)}</td><td>${esc(pName(pr.product_id))}</td><td>${esc(cName(pr.channel_id))}</td>
      <td class="num">${pr.tipo_desconto === 'percentual' ? pct(pr.desconto_percentual) : money(pr.desconto_fixo_centavos)}</td>
      <td class="num">${pct(pr.percentual_canal)}</td>
      <td>${pr.ativo ? '<span class="pill pill-ok">ativa</span>' : '<span class="pill pill-neutral">inativa</span>'}</td>
      <td class="table-actions">${pr.ativo ? `<button class="btn btn-sm btn-danger" onclick="deactivatePromotion('${pr.id}')">Desativar</button>` : ''}</td>
      </tr>`).join('')}
    </tbody></table></div>`;
};

async function openPromotionModal() {
  const products = await api('/products?incluir_arquivados=false');
  const channels = await api('/channels?incluir_arquivados=false');
  if (products.length === 0 || channels.length === 0) { toast('Cadastre ao menos 1 produto e 1 canal antes.', 'error'); return; }
  openModal('Nova promoção', `
    <div class="field"><label>Nome</label><input type="text" id="promo-nome" placeholder="Ex: 20% OFF Quinta"></div>
    <div class="field-row">
      <div class="field"><label>Produto</label><select id="promo-product">${products.map(p => `<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select></div>
      <div class="field"><label>Canal</label><select id="promo-channel">${channels.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>Tipo de desconto</label>
      <select id="promo-tipo" onchange="togglePromoTipoFields()">
        <option value="percentual">Percentual</option>
        <option value="valor_fixo">Valor fixo</option>
      </select>
    </div>
    <div class="field" id="promo-pct-field"><label>Desconto (%)</label><input type="text" inputmode="decimal" autocomplete="off" step="0.01" id="promo-desconto-pct" value="10"></div>
    <div class="field" id="promo-fixo-field" style="display:none;"><label>Desconto (R$)</label><input type="text" inputmode="decimal" autocomplete="off" step="0.01" id="promo-desconto-fixo"></div>
    <div class="field-row">
      <div class="field"><label>% que o canal banca do desconto</label><input type="text" inputmode="decimal" autocomplete="off" step="0.01" id="promo-pct-canal" value="0"></div>
      <div class="field"><label>Subsídio máximo (R$, opcional)</label><input type="text" inputmode="decimal" autocomplete="off" step="0.01" id="promo-subsidio-max"></div>
    </div>
  `, [
    { label: 'Cancelar', cls: 'btn-secondary', onClick: closeModal },
    { label: 'Criar', cls: 'btn-primary', onClick: async () => {
      const tipo = document.getElementById('promo-tipo').value;
      const subMax = document.getElementById('promo-subsidio-max').value;
      const payload = {
        product_id: document.getElementById('promo-product').value,
        channel_id: document.getElementById('promo-channel').value,
        nome: document.getElementById('promo-nome').value,
        tipo_desconto: tipo,
        desconto_percentual: tipo === 'percentual' ? parseNumBR(document.getElementById('promo-desconto-pct').value) : null,
        desconto_fixo_centavos: tipo === 'valor_fixo' ? Math.round(parseNumBR(document.getElementById('promo-desconto-fixo').value) * 100) : null,
        percentual_canal: parseNumBR(document.getElementById('promo-pct-canal').value || 0),
        subsidio_maximo_centavos: subMax === '' ? null : Math.round(parseNumBR(subMax) * 100),
      };
      try {
        await api('/promotions', { method: 'POST', body: JSON.stringify(payload) });
        closeModal(); toast('Promoção criada.'); goToSection('promocoes');
      } catch (err) { toast(err.message, 'error'); }
    }},
  ]);
}
function togglePromoTipoFields() {
  const tipo = document.getElementById('promo-tipo').value;
  document.getElementById('promo-pct-field').style.display = tipo === 'percentual' ? 'block' : 'none';
  document.getElementById('promo-fixo-field').style.display = tipo === 'valor_fixo' ? 'block' : 'none';
}
async function deactivatePromotion(id) {
  if (!confirm('Desativar esta promoção?')) return;
  try { await api(`/promotions/${id}/deactivate`, { method: 'POST' }); toast('Promoção desativada.'); goToSection('promocoes'); }
  catch (err) { toast(err.message, 'error'); }
}

// ============================================================
// CUSTOS FIXOS
// ============================================================
SECTION_RENDERERS['custos-fixos'] = async function () {
  const el = document.getElementById('section-custos-fixos');
  document.getElementById('header-extra').innerHTML = `<button class="btn btn-primary" onclick="openFixedCostModal()">+ Novo custo fixo</button>`;
  const list = await api('/fixed-costs?incluir_arquivados=false');
  if (list.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="big">Nenhum custo fixo cadastrado</div>Aluguel, salários fixos — entram no cálculo do Resultado Operacional.</div>`;
    return;
  }
  const total = list.reduce((s, f) => s + f.valor_mensal_centavos, 0);
  el.innerHTML = `
    <div class="stat" style="margin-bottom:16px;max-width:280px;"><div class="label">Total mensal</div><div class="value">${money(total)}</div></div>
    <div class="table-wrap"><table class="data-table">
    <thead><tr><th>Nome</th><th class="num">Valor mensal</th><th></th></tr></thead>
    <tbody>${list.map(f => `
      <tr><td>${esc(f.nome)}</td><td class="num">${money(f.valor_mensal_centavos)}</td>
      <td class="table-actions">
        <button class="btn btn-sm btn-secondary" onclick="openFixedCostModal('${f.id}')">Editar</button>
        <button class="btn btn-sm btn-danger" onclick="archiveFixedCost('${f.id}')">Arquivar</button>
      </td></tr>`).join('')}
    </tbody></table></div>`;
};
async function openFixedCostModal(id) {
  let f = { nome: '', valor_mensal_centavos: 0 };
  if (id) f = await api(`/fixed-costs/${id}`);
  openModal(id ? 'Editar custo fixo' : 'Novo custo fixo', `
    <div class="field"><label>Nome</label><input type="text" id="fc-nome" value="${esc(f.nome)}" placeholder="Ex: Aluguel"></div>
    <div class="field"><label>Valor mensal (R$)</label><input type="text" inputmode="decimal" autocomplete="off" step="0.01" id="fc-valor" value="${(f.valor_mensal_centavos/100).toFixed(2)}"></div>
  `, [
    { label: 'Cancelar', cls: 'btn-secondary', onClick: closeModal },
    { label: id ? 'Salvar' : 'Criar', cls: 'btn-primary', onClick: async () => {
      const payload = { nome: document.getElementById('fc-nome').value, valor_mensal_centavos: Math.round(parseNumBR(document.getElementById('fc-valor').value) * 100) };
      try {
        if (id) await api(`/fixed-costs/${id}`, { method: 'PATCH', body: JSON.stringify(payload) });
        else await api('/fixed-costs', { method: 'POST', body: JSON.stringify(payload) });
        closeModal(); toast(id ? 'Atualizado.' : 'Criado.'); goToSection('custos-fixos');
      } catch (err) { toast(err.message, 'error'); }
    }},
  ]);
}
async function archiveFixedCost(id) {
  if (!confirm('Arquivar este custo fixo?')) return;
  try { await api(`/fixed-costs/${id}/archive`, { method: 'POST' }); toast('Arquivado.'); goToSection('custos-fixos'); }
  catch (err) { toast(err.message, 'error'); }
}

// ============================================================
// DESPESAS
// ============================================================
SECTION_RENDERERS['despesas'] = async function () {
  const el = document.getElementById('section-despesas');
  document.getElementById('header-extra').innerHTML = `<button class="btn btn-primary" onclick="openExpenseModal()">+ Nova despesa</button>`;
  const list = await api('/expenses');
  if (list.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="big">Nenhuma despesa registrada</div>Financeiras (juros) ou não-operacionais (conserto) — entram no Lucro Líquido.</div>`;
    return;
  }
  el.innerHTML = `<div class="table-wrap"><table class="data-table">
    <thead><tr><th>Data</th><th>Nome</th><th>Tipo</th><th class="num">Valor</th></tr></thead>
    <tbody>${list.map(e => `<tr><td>${fmtDate(e.data)}</td><td>${esc(e.nome)}</td><td>${esc(e.tipo)}</td><td class="num">${money(e.valor_centavos)}</td></tr>`).join('')}
    </tbody></table></div>`;
};
async function openExpenseModal() {
  openModal('Nova despesa', `
    <div class="field"><label>Tipo</label>
      <select id="exp-tipo"><option value="financeira">Financeira (juros, taxas)</option><option value="nao_operacional">Não-operacional</option></select>
    </div>
    <div class="field"><label>Nome</label><input type="text" id="exp-nome" placeholder="Ex: Juros do empréstimo"></div>
    <div class="field"><label>Valor (R$)</label><input type="text" inputmode="decimal" autocomplete="off" step="0.01" id="exp-valor"></div>
    <p class="hint">Sempre vinculada ao período financeiro aberto agora.</p>
  `, [
    { label: 'Cancelar', cls: 'btn-secondary', onClick: closeModal },
    { label: 'Registrar', cls: 'btn-primary', onClick: async () => {
      try {
        await api('/expenses', { method: 'POST', body: JSON.stringify({
          tipo: document.getElementById('exp-tipo').value,
          nome: document.getElementById('exp-nome').value,
          valor_centavos: Math.round(parseNumBR(document.getElementById('exp-valor').value) * 100),
        })});
        closeModal(); toast('Despesa registrada.'); goToSection('despesas');
      } catch (err) { toast(err.message, 'error'); }
    }},
  ]);
}

// ============================================================

  el.innerHTML = `
    <div class="grid-3" style="margin-bottom:20px;">
      <div class="stat"><div class="label">Vendas no período</div><div class="value">${r.quantidade_vendas}</div></div>
      <div class="stat"><div class="label">Faturamento bruto</div><div class="value">${money(r.faturamento_bruto_centavos)}</div></div>
      <div class="stat"><div class="label">Lucro líquido</div><div class="value ${r.lucro_liquido_centavos >= 0 ? 'positive' : 'negative'}">${money(r.lucro_liquido_centavos)}</div></div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h3>Cascata financeira do período aberto</h3>
        <div class="receipt-line"><span class="label">Faturamento bruto</span><span class="value">${money(r.faturamento_bruto_centavos)}</span></div>
        <div class="receipt-line"><span class="label">(–) Descontos bancados pela loja</span><span class="value">${money(r.descontos_bancados_centavos)}</span></div>
        <div class="receipt-line"><span class="label">= Faturamento líquido</span><span class="value">${money(r.faturamento_liquido_centavos)}</span></div>
        <div class="receipt-line"><span class="label">(–) CIV (custo dos ingredientes vendidos)</span><span class="value">${money(r.civ_centavos)}</span></div>
        <div class="receipt-line"><span class="label">= Margem bruta</span><span class="value">${money(r.margem_bruta_centavos)}</span></div>
        <div class="receipt-line"><span class="label">(–) Embalagem</span><span class="value">${money(r.embalagem_centavos)}</span></div>
        <div class="receipt-line"><span class="label">(–) Mão de obra</span><span class="value">${money(r.mao_de_obra_centavos)}</span></div>
        <div class="receipt-line"><span class="label">(–) Taxa fixa de canal</span><span class="value">${money(r.taxa_fixa_canal_centavos)}</span></div>
        <div class="receipt-line"><span class="label">(–) Comissão + imposto sobre vendas</span><span class="value">${money(r.comissao_mais_imposto_venda_centavos)}</span></div>
        <div class="receipt-line total"><span class="label">= Margem de contribuição</span><span class="value">${money(r.margem_contribuicao_centavos)}</span></div>
      </div>
      <div class="card">
        <h3>Do operacional ao lucro líquido</h3>
        <div class="receipt-line"><span class="label">Margem de contribuição</span><span class="value">${money(r.margem_contribuicao_centavos)}</span></div>
        <div class="receipt-line"><span class="label">(–) Custos fixos do período</span><span class="value">${money(r.custo_fixo_periodo_centavos)}</span></div>
        <div class="receipt-line"><span class="label">= Resultado operacional</span><span class="value">${money(r.resultado_operacional_centavos)}</span></div>
        <div class="receipt-line"><span class="label">(–) Despesas financeiras</span><span class="value">${money(r.despesas_financeiras_centavos)}</span></div>
        <div class="receipt-line"><span class="label">(–) Despesas não-operacionais</span><span class="value">${money(r.despesas_nao_operacionais_centavos)}</span></div>
        <div class="receipt-line"><span class="label">= Lucro antes do imposto</span><span class="value">${money(r.lucro_antes_imposto_centavos)}</span></div>
        <div class="receipt-line"><span class="label">(–) Imposto sobre o lucro</span><span class="value">${money(r.imposto_lucro_centavos)}</span></div>
        <div class="receipt-line total"><span class="label">= Lucro líquido</span><span class="value ${r.lucro_liquido_centavos >= 0 ? '' : ''}" style="color:${r.lucro_liquido_centavos >= 0 ? 'var(--forest)' : 'var(--brick)'};">${money(r.lucro_liquido_centavos)}</span></div>

    <div class="card">
      <h3>Produtos mais rentáveis (histórico completo)</h3>
      ${ranking.length ? `<div class="table-wrap"><table class="data-table">

        <tbody>${ranking.map(p => `<tr><td>${esc(p.product_nome)}</td><td class="num">${p.quantidade_vendida}</td><td class="num">${money(p.faturamento_centavos)}</td><td class="num" style="font-weight:600;color:${p.margem_contribuicao_total_centavos>=0?'var(--forest)':'var(--brick)'};">${money(p.margem_contribuicao_total_centavos)}</td></tr>`).join('')}
